<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camila Accoroni — UX Specialist</title>
  <meta name="description" content="Pesquiso por que usuários param onde o produto precisa que avancem.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Tokens ── */
    :root {
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-mono:    'IBM Plex Mono', monospace;
      --gutter:       clamp(1.5rem, 6vw, 5rem);
      --max-w:        680px;
    }

    [data-theme="dark"] {
      --bg:         #0E0E0C;
      --ink:        #EAE8E1;
      --ink-muted:  #8A8880;
      --ink-ghost:  #3A3A36;
      --rule:       #252520;
    }

    [data-theme="light"] {
      --bg:         #F5F4F0;
      --ink:        #1A1A18;
      --ink-muted:  #5A5855;
      --ink-ghost:  #C4C2BC;
      --rule:       #D4D2CC;
    }

    /* ── Base ── */
    html {
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      font-weight: 300;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      transition: background 0.25s, color 0.25s;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
      padding: 0 var(--gutter);
      transition: background 0.25s, border-color 0.25s;
    }

    .header-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Monograma */
    .logo {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--rule);
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s;
      flex-shrink: 0;
    }

    .logo:hover { border-color: var(--ink-muted); }

    /* Nav */
    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav a {
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--ink); }

    /* Toggle tema */
    .theme-toggle {
      background: none;
      border: 1px solid var(--rule);
      color: var(--ink-muted);
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.3rem 0;
      width: 3.8rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--ink-muted);
      color: var(--ink);
    }

    /* ── Main ── */
    main {
      padding: clamp(4rem, 10vw, 7rem) var(--gutter) 4rem;
    }

    .content {
      max-width: var(--max-w);
      margin: 0 auto;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Localização */
    .location {
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 2.5rem;
    }

    /* Nome */
    h1 {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 2rem;
    }

    h1 em {
      font-style: italic;
    }

    /* Separador */
    hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin-bottom: 2rem;
    }

    /* Bio */
    .bio {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1.6;
      color: var(--ink);
      max-width: 38ch;
      margin-bottom: 3.5rem;
    }

    /* Links de contato */
    .contact {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .contact a {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      text-decoration: none;
      color: var(--ink);
      width: fit-content;
      transition: color 0.2s;
    }

    .contact a:hover { color: var(--ink-muted); }

    .contact-label {
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
      width: 4.5rem;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .contact-value {
      font-size: 0.82rem;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    /* ── Footer ── */
    footer {
      padding: 1.5rem var(--gutter);
      border-top: 1px solid var(--rule);
      transition: border-color 0.25s;
    }

    .footer-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    footer p, footer a {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-ghost);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--ink-muted); }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      nav { display: none; }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <a href="/" class="logo" aria-label="Início">CA</a>
      <nav aria-label="Navegação principal">
        <a href="/">Home</a>
        <a href="/cases">Cases</a>
        <a href="#contato">Contato</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">light</button>
    </div>
  </header>

  <main>
    <div class="content">

      <p class="location">Belo Horizonte · disponível</p>

      <h1>Camila<br><em>Accoroni</em></h1>

      <hr>

      <p class="bio">
        Pesquiso por que usuários param onde o produto precisa que avancem.
      </p>



    </div>
  </main>

  <footer id="contato">
    <div class="footer-inner">
      <p>© 2026 Camila Accoroni</p>
      <nav class="footer-links" aria-label="Links">
        <a href="https://linkedin.com/in/camilaccoroni" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="mailto:camilaccoroni@gmail.com">Email</a>
      </nav>
    </div>
  </footer>

  <script>
    const btn = document.getElementById('theme-toggle');
    const root = document.documentElement;

    btn.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      root.setAttribute('data-theme', isDark ? 'light' : 'dark');
      btn.textContent = isDark ? 'dark' : 'light';
    });
  </script>

</body>
</html>
